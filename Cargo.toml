[package]
name = "misura"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Where an HTTP request spends its time: DNS, TCP, TLS, waiting and transfer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickvigilante/misura"
readme = "README.md"
keywords = ["http", "latency", "timing", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
assert_cmd = "2.2.2"
futures-core = "0.3.34"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "tokio"] }
insta = { version = "1.49.0", features = ["filters"] }
predicates = "3.1.4"
rcgen = "0.14.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["sync", "rt", "macros", "net", "time"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
